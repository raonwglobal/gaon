name: Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] && grep -q '"node_modules/' package-lock.json; then
            npm ci
          else
            echo "package-lock incomplete or missing; using npm install"
            npm install
          fi

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            context: .
            file: packages/core/Dockerfile
          - image: control-plane
            context: .
            file: packages/control-plane/Dockerfile
          - image: dashboard
            context: .
            file: packages/dashboard/Dockerfile
          - image: plugin-runtime
            context: packages/plugin-runtime
            file: packages/plugin-runtime/Dockerfile
          - image: install-worker
            context: packages/install-worker
            file: packages/install-worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64

  summary:
    name: Image summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print image names
        run: |
          echo "### Docker images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Reference |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          REPO="${{ env.REGISTRY }}/${{ github.repository }}"
          for img in core control-plane dashboard plugin-runtime install-worker; do
            echo "| \`$img\` | \`$REPO/$img:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
