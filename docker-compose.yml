services:
  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    image: gaon/core:local
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENABLED_PLUGINS=weather,echo
      - ALLOWED_ORIGINS=*
      - RATE_LIMIT_PER_MIN=120
      - MAX_SESSIONS=500
      - PLUGINS_DIR=/app/plugins
      # inprocess (default) | container
      - PLUGIN_RUNTIME=${PLUGIN_RUNTIME:-inprocess}
      - ORCHESTRATOR=${ORCHESTRATOR:-endpoint}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-internal}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
    volumes:
      - ./plugins:/app/plugins:ro
    depends_on:
      - plugin-runtime
    restart: unless-stopped

  plugin-runtime:
    build:
      context: packages/plugin-runtime
      dockerfile: Dockerfile
    image: gaon/plugin-runtime:local
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PLUGIN_ID=echo
    restart: unless-stopped

  control-plane:
    build:
      context: .
      dockerfile: packages/control-plane/Dockerfile
    image: gaon/control-plane:local
    ports:
      - "3001:3001"
    environment:
      - CONTROL_PORT=3001
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-internal}
      - CORE_URL=http://core:3000
      - DATABASE_PATH=/data/platform.json
      - PLUGINS_DIR=/plugins
    volumes:
      - control-data:/data
      # read-write: git/npm install writes here (shared with core)
      - ./plugins:/plugins
    depends_on:
      - core
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    image: gaon/dashboard:local
    ports:
      - "5173:80"
    environment:
      # Injected into /config.json at container start for Settings / API auth
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
      - CONTROL_API_BASE=${CONTROL_API_BASE:-}
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  control-data:
