services:
  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    image: gaon/core:local
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENABLED_PLUGINS=weather,echo
      - ALLOWED_ORIGINS=*
      - RATE_LIMIT_PER_MIN=120
      - MAX_SESSIONS=500
      - PLUGINS_DIR=/app/plugins
      - PLUGIN_RUNTIME=${PLUGIN_RUNTIME:-inprocess}
      - ORCHESTRATOR=${ORCHESTRATOR:-endpoint}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-internal}
      - API_SECRET_TOKEN=${API_SECRET_TOKEN:-}
      - GATEWAY_REQUIRE_AUTH=${GATEWAY_REQUIRE_AUTH:-false}
      - GATEWAY_TOKENS=${GATEWAY_TOKENS:-}
      - CONTROL_URL=http://control-plane:3001
      - VAULT_SESSION_INJECT=${VAULT_SESSION_INJECT:-true}
    volumes:
      - ./plugins:/app/plugins:ro
    depends_on:
      - plugin-runtime
      - control-plane
    restart: unless-stopped

  plugin-runtime:
    build:
      context: packages/plugin-runtime
      dockerfile: Dockerfile
    image: gaon/plugin-runtime:local
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PLUGIN_ID=echo
    restart: unless-stopped

  control-plane:
    build:
      context: .
      dockerfile: packages/control-plane/Dockerfile
    image: gaon/control-plane:local
    ports:
      - "3001:3001"
    environment:
      - CONTROL_PORT=3001
      - BOOTSTRAP_ADMIN_USER=${BOOTSTRAP_ADMIN_USER:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-changeme-please}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-internal}
      - CORE_URL=http://core:3000
      - DATABASE_PATH=/data/platform.json
      - USERS_PATH=/data/users.json
      - PLUGINS_DIR=/plugins
      - ADMIN_CORS_ORIGINS=${ADMIN_CORS_ORIGINS:-*}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-}
      - GIT_ALLOW_HOSTS=${GIT_ALLOW_HOSTS:-github.com,gitlab.com}
      - GIT_BLOCK_PRIVATE=${GIT_BLOCK_PRIVATE:-true}
      - INSTALL_WORKER_URL=${INSTALL_WORKER_URL:-http://install-worker:3002}
      - PLUGIN_SIGNING_KEY=${PLUGIN_SIGNING_KEY:-}
      - PLUGIN_SIGNATURE_REQUIRED=${PLUGIN_SIGNATURE_REQUIRED:-false}
    volumes:
      - control-data:/data
      - ./plugins:/plugins
    depends_on:
      - install-worker
    restart: unless-stopped

  install-worker:
    build:
      context: packages/install-worker
      dockerfile: Dockerfile
    image: gaon/install-worker:local
    environment:
      - INSTALL_WORKER_PORT=3002
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-internal}
      - PLUGINS_DIR=/plugins
      - GIT_ALLOW_HOSTS=${GIT_ALLOW_HOSTS:-github.com,gitlab.com}
      - GIT_BLOCK_PRIVATE=${GIT_BLOCK_PRIVATE:-true}
      - PLUGIN_SIGNING_KEY=${PLUGIN_SIGNING_KEY:-}
      - PLUGIN_SIGNATURE_REQUIRED=${PLUGIN_SIGNATURE_REQUIRED:-false}
    volumes:
      - ./plugins:/plugins
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    image: gaon/dashboard:local
    ports:
      - "5173:80"
    environment:
      - CONTROL_API_BASE=${CONTROL_API_BASE:-}
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  control-data:
