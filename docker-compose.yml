services:
  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ENABLED_PLUGINS=weather
      - ALLOWED_ORIGINS=*
      - RATE_LIMIT_PER_MIN=120
      - MAX_SESSIONS=500
    restart: unless-stopped

  control-plane:
    build:
      context: .
      dockerfile: packages/control-plane/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - CONTROL_PORT=3001
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
      - CORE_URL=http://core:3000
    depends_on:
      - core
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - control-plane
    restart: unless-stopped
